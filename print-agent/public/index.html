<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print Counter</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f4f6; color: #111; margin: 0; display: flex; justify-content: center; }
  main { width: min(720px, 100%); padding: 32px 20px; }
  h1 { margin: 0 0 20px; font-size: 24px; }
  form { display: flex; gap: 10px; }
  input { flex: 1; font: 700 32px ui-monospace, Menlo, monospace; letter-spacing: .2em; text-transform: uppercase;
    padding: 12px 16px; border: 2px solid #ccc; border-radius: 12px; }
  input:focus { outline: none; border-color: #111; }
  button { font: 600 18px system-ui; padding: 12px 22px; border: 0; border-radius: 12px; cursor: pointer; background: #111; color: #fff; }
  button.secondary { background: #ddd; color: #111; }
  button:disabled { opacity: .5; cursor: default; }
  #card { margin-top: 24px; background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,.06); display: none; }
  #meta { color: #555; margin: 0 0 12px; }
  #preview { display: block; max-width: 100%; border: 1px solid #ddd; image-rendering: pixelated; background: #fff; }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  #msg { margin-top: 14px; font-weight: 600; min-height: 1.4em; }
  .ok { color: #1a7f37; } .err { color: #c62828; }
  #cfg { margin-top: 28px; font-size: 13px; color: #888; }
</style>
</head>
<body>
<main>
  <h1>🖨️ Print Counter</h1>
  <form id="f">
    <input id="code" placeholder="CODE" maxlength="8" autocomplete="off" autofocus>
    <button type="submit" id="look">Look up</button>
  </form>

  <div id="card">
    <p id="meta"></p>
    <img id="preview" alt="preview">
    <div class="actions">
      <button id="print">Print</button>
      <button class="secondary" type="button" onclick="reset()">Clear</button>
    </div>
    <div id="msg"></div>
  </div>
  <div id="cfg"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let current = null;

fetch('/api/config').then((r) => r.json()).then((c) => {
  $('cfg').textContent = `Server: ${c.server} · Printer: ${c.printer} · ${c.width} dots`;
});

$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const code = $('code').value.trim().toUpperCase();
  if (!code) return;
  $('look').disabled = true; $('msg').textContent = ''; $('card').style.display = 'none';
  try {
    const r = await fetch('/api/lookup/' + code);
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    current = j;
    $('meta').textContent = `${j.code} · taken ${new Date(j.createdAt).toLocaleString()} · printed ${j.prints || 0}×`;
    $('preview').src = '/api/preview/' + code + '?t=' + Date.now();
    $('card').style.display = 'block';
  } catch (err) {
    $('card').style.display = 'block'; $('preview').removeAttribute('src'); $('meta').textContent = '';
    show('err', err.message);
  } finally { $('look').disabled = false; }
});

$('print').addEventListener('click', async () => {
  if (!current) return;
  $('print').disabled = true; show('', 'Printing…');
  try {
    const r = await fetch('/api/print/' + current.code, { method: 'POST' });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    show('ok', 'Printed ✓');
    setTimeout(reset, 2500);
  } catch (err) { show('err', 'Print failed: ' + err.message); }
  finally { $('print').disabled = false; }
});

function show(cls, text) { $('msg').className = cls; $('msg').textContent = text; }
function reset() { current = null; $('code').value = ''; $('card').style.display = 'none'; $('msg').textContent = ''; $('code').focus(); }
</script>
</body>
</html>
